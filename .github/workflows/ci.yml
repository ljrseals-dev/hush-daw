name: HUSH Advanced Hardening & Fuzzing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  hardening-and-fuzz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libx11-dev libportaudio2 portaudio19-dev xvfb

      - name: Configure, Build, and Test Available CMake Subprojects with Sanitizers
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for source in cosmic-studio integration/hush-processor-bridge integration/no-frills-gui; do
            if [[ ! -f "$source/CMakeLists.txt" ]]; then
              continue
            fi
            found=1
            build_dir="build-sanitized-${source//\//-}"
            echo "::group::Configure $source"
            cmake -S "$source" -B "$build_dir" \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
            echo "::endgroup::"
            cmake --build "$build_dir" --parallel "$(nproc)"
            if [[ -f "$build_dir/CTestTestfile.cmake" ]]; then
              ctest --test-dir "$build_dir" --output-on-failure
            else
              echo "::notice::$source has no registered CTest tests; compile validation completed."
            fi
          done
          if [[ "$found" -eq 0 ]]; then
            echo "::notice::No supported CMake subproject is present on this ref. The repository currently has no root CMakeLists.txt; no full DAW build is claimed."
          fi

      - name: Execute FKSESSION Parser Fuzzing Gate When Available
        shell: bash
        run: |
          set -euo pipefail
          fuzz_target="$(find . -path './.git' -prune -o -type f -name hush_fuzz_harness -perm -u+x -print -quit)"
          if [[ -n "$fuzz_target" ]]; then
            "$fuzz_target" --runs=5000 --timeout=15
          else
            echo "::notice::FKSESSION fuzz harness is not present in this ref; fuzzing is skipped rather than reporting a false pass."
          fi
