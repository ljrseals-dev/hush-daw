name: HUSH Advanced Hardening & Fuzzing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  hardening-and-fuzz:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libx11-dev libportaudio2 portaudio19-dev xvfb ctest

    - name: Configure CMake with Sanitizers (ASAN / UBSAN)
      run: |
        cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug \
          -DHUSH_WARNINGS_AS_ERRORS=ON \
          -DHUSH_BUILD_X11_GUI=ON \
          -DHUSH_ENABLE_PORTAUDIO=OFF \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

    - name: Build Sanitized Target
      run: cmake --build build-sanitized --parallel $(nproc)

    - name: Run Network-Isolated Sanitized Test Suites
      run: ctest --test-dir build-sanitized --output-on-failure

    - name: Execute FKSESSION Parser Fuzzing Gate
      run: |
        # Run targeted fuzzing harness verification against session reader/writer components
        ./build-sanitized/tests/hush_fuzz_harness --runs=5000 --timeout=15
